name: claude-desktop
title: Claude Desktop
version: '1.0.0'
summary: Anthropic's Claude AI assistant desktop application
description: |
  Claude Desktop provides native access to Anthropic's Claude AI models
  with enhanced capabilities through Model Context Protocol (MCP) support.
  
  **Features:**
  - Direct access to Claude models (Claude 3.5 Sonnet, etc.)
  - Model Context Protocol (MCP) for extending capabilities
  - Native desktop integration with system tray support
  - Keyboard shortcuts including global hotkeys
  - Artifact mode for building custom applications
  
  **Note:** This is an unofficial Linux port of the official Claude Desktop
  application. Some features may have limited functionality compared to
  the official Windows/macOS versions.

license: Proprietary
contact: https://claude.ai/support
website: https://claude.ai
issues: https://github.com/ted-gould/claude-desktop-snap/issues

grade: stable
confinement: devmode
base: core22
architectures:
  - amd64

apps:
  claude-desktop:
    command: claude-desktop/claude
    desktop: snap/gui/claude-desktop.desktop
    extensions: [gnome]
    environment:
      # Electron/Chrome flags for better compatibility
      DISABLE_WAYLAND: 1
      ELECTRON_DISABLE_SECURITY_WARNINGS: 1
      # Path for MCP configuration
      CLAUDE_CONFIG_PATH: $SNAP_USER_DATA/.config/Claude
      # Disable sandboxing that might interfere
      ELECTRON_NO_SANDBOX: 1
    plugs:
      - audio-playback
      - browser-support
      - desktop
      - desktop-legacy
      - gsettings
      - home
      - network
      - network-bind
      - opengl
      - pulseaudio
      - removable-media
      - screen-inhibit-control
      - unity7
      - wayland
      - x11

layout:
  /usr/share/fonts:
    bind: $SNAP/usr/share/fonts
  /usr/share/icons:
    bind: $SNAP/usr/share/icons
  /usr/lib/$SNAPCRAFT_ARCH_TRIPLET/webkit2gtk-4.0:
    bind: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/webkit2gtk-4.0

parts:
  claude-desktop:
    plugin: nil
    build-packages:
      - wget
      - p7zip-full
      - unzip
      - jq
    stage-packages:
      - libgtk-3-0
      - libnotify4
      - libnss3
      - libxss1
      - libxtst6
      - libatspi2.0-0
      - libsecret-1-0
      - libasound2
      - libgbm1
      - libdrm2
      - libxkbcommon0
      - libxrandr2
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxcursor1
      - libxi6
      - libx11-xcb1
    override-build: |
      set -eux
      
      # Download the Windows installer
      wget -O Claude-Setup-x64.exe "https://storage.googleapis.com/osprey-downloads-c02f6a0d-347c-492b-a752-3e0651722e97/nest-win-x64/Claude-Setup-x64.exe"
      
      # Extract Windows installer
      7z x Claude-Setup-x64.exe
      
      # Extract the nupkg file
      NUPKG=$(find . -name "*.nupkg" | grep -v "delta" | head -1)
      if [ -n "$NUPKG" ]; then
        echo "Found nupkg: $NUPKG"
        7z x "$NUPKG" -oapp_contents
      fi
      
      # Extract key information from the Windows app
      cd app_contents/lib/net45
      
      # Get version and electron version from package.json in app.asar
      npx asar extract resources/app.asar app_extracted
      ELECTRON_VERSION=$(jq -r '.devDependencies.electron // "28.2.10"' app_extracted/package.json)
      APP_VERSION=$(jq -r '.version // "0.9.3"' app_extracted/package.json)
      echo "Detected Electron version: $ELECTRON_VERSION"
      echo "Detected App version: $APP_VERSION"
      
      # Clean up extraction
      rm -rf app_extracted
      cd -
      
      # Download Linux Electron binary
      echo "Downloading Electron $ELECTRON_VERSION for Linux..."
      ELECTRON_ARCH="x64"
      ELECTRON_URL="https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-linux-${ELECTRON_ARCH}.zip"
      wget -O electron.zip "$ELECTRON_URL"
      
      # Create the installation directory
      mkdir -p $SNAPCRAFT_PART_INSTALL/claude-desktop
      
      # Extract Electron
      unzip -q electron.zip -d $SNAPCRAFT_PART_INSTALL/claude-desktop/
      rm electron.zip
      
      # Copy app resources from Windows build
      cp -r app_contents/lib/net45/resources $SNAPCRAFT_PART_INSTALL/claude-desktop/
      cp app_contents/lib/net45/LICENSE* $SNAPCRAFT_PART_INSTALL/claude-desktop/ || true
      
      # Remove Windows-specific files
      rm -f $SNAPCRAFT_PART_INSTALL/claude-desktop/*.dll
      rm -f $SNAPCRAFT_PART_INSTALL/claude-desktop/*.exe
      
      # Rename electron executable to claude
      mv $SNAPCRAFT_PART_INSTALL/claude-desktop/electron $SNAPCRAFT_PART_INSTALL/claude-desktop/claude
      chmod +x $SNAPCRAFT_PART_INSTALL/claude-desktop/claude
      
      # Handle the native bindings issue by creating stub bindings
      NATIVE_DIR="$SNAPCRAFT_PART_INSTALL/claude-desktop/resources/app.asar.unpacked/node_modules/claude-native"
      if [ -d "$NATIVE_DIR" ] || [ -d "${NATIVE_DIR%/*}" ]; then
        mkdir -p "$NATIVE_DIR"
        
        # Create a stub index.js that doesn't require native bindings
        cat > "$NATIVE_DIR/index.js" << 'EOF'
      // Linux stub for claude-native module
      console.log('[claude-native] Using Linux stub implementation');
      
      const stub = {
        registerGlobalShortcut: (accelerator, callback) => {
          console.log('[claude-native] registerGlobalShortcut:', accelerator);
          return true;
        },
        unregisterGlobalShortcut: (accelerator) => {
          console.log('[claude-native] unregisterGlobalShortcut:', accelerator);
          return true;
        },
        unregisterAllGlobalShortcuts: () => {
          console.log('[claude-native] unregisterAllGlobalShortcuts');
          return true;
        },
        isAccessibilityEnabled: () => {
          return true;
        },
        setLoginItemSettings: (settings) => {
          console.log('[claude-native] setLoginItemSettings:', settings);
        },
        getLoginItemSettings: () => {
          return { openAtLogin: false };
        },
        setTrayIcon: (iconPath) => {
          console.log('[claude-native] setTrayIcon:', iconPath);
          return true;
        },
        showTrayBalloon: (options) => {
          console.log('[claude-native] showTrayBalloon:', options);
          return true;
        },
        getWindowHandle: () => {
          return null;
        }
      };
      
      module.exports = stub;
      EOF
        
        # Create empty .node file to prevent "file not found" errors
        touch "$NATIVE_DIR/claude-native-binding.node"
        chmod 755 "$NATIVE_DIR/claude-native-binding.node"
      fi
      
      # Extract and create icon
      mkdir -p $SNAPCRAFT_PART_INSTALL/meta/gui
      mkdir -p $SNAPCRAFT_PART_INSTALL/snap/gui
      
      # Try to extract icon from resources
      ICON_PATH=""
      for icon in $(find $SNAPCRAFT_PART_INSTALL/claude-desktop/resources -name "*.png" -o -name "*.ico" | grep -i icon | head -5); do
        if [ -f "$icon" ]; then
          ICON_PATH="$icon"
          break
        fi
      done
      
      if [ -n "$ICON_PATH" ] && [ -f "$ICON_PATH" ]; then
        cp "$ICON_PATH" $SNAPCRAFT_PART_INSTALL/meta/gui/icon.png
      else
        # Create a simple icon as fallback
        cat > $SNAPCRAFT_PART_INSTALL/meta/gui/icon.svg << 'EOF'
      <svg width="256" height="256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#f4f4f4"/>
        <circle cx="128" cy="128" r="100" fill="#333333"/>
        <text x="128" y="160" font-family="Arial" font-size="120" fill="white" text-anchor="middle">C</text>
      </svg>
      EOF
      fi
      
      cp $SNAPCRAFT_PART_INSTALL/meta/gui/icon.* $SNAPCRAFT_PART_INSTALL/snap/gui/claude-desktop.png || true
      
      # Create desktop file
      cat > $SNAPCRAFT_PART_INSTALL/snap/gui/claude-desktop.desktop << EOF
      [Desktop Entry]
      Type=Application
      Version=1.1
      Name=Claude
      GenericName=AI Assistant
      Comment=Anthropic's Claude AI desktop application
      Icon=\${SNAP}/meta/gui/icon.png
      Exec=claude-desktop --no-sandbox %U
      Terminal=false
      StartupNotify=true
      StartupWMClass=Claude
      Categories=Office;Chat;InstantMessaging;Network;
      Keywords=ai;assistant;claude;anthropic;chat;mcp;
      MimeType=x-scheme-handler/claude;
      Actions=new-window;
      
      [Desktop Action new-window]
      Name=New Chat Window
      Exec=claude-desktop --no-sandbox --new-window
      EOF
      
      # Set proper permissions
      find $SNAPCRAFT_PART_INSTALL -type f -name "*.so" -exec chmod 755 {} \;
      find $SNAPCRAFT_PART_INSTALL -type f -name "*.node" -exec chmod 755 {} \;
      find $SNAPCRAFT_PART_INSTALL -type f -name "claude" -exec chmod 755 {} \;