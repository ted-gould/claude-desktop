name: claude-desktop
title: Claude Desktop
version: '1.0.0'
summary: Anthropic's Claude AI assistant desktop application
description: |
  Claude Desktop provides native access to Anthropic's Claude AI models
  with enhanced capabilities through Model Context Protocol (MCP) support.
  
  **Features:**
  - Direct access to Claude models (Claude 3.5 Sonnet, etc.)
  - Model Context Protocol (MCP) for extending capabilities
  - Native desktop integration with system tray support
  - Keyboard shortcuts including global hotkeys
  - Artifact mode for building custom applications
  
  **Note:** This is an unofficial Linux port of the official Claude Desktop
  application. Some features may have limited functionality compared to
  the official Windows/macOS versions.

license: Proprietary
contact: https://claude.ai/support
website: https://claude.ai
issues: https://github.com/[community-maintainer]/claude-desktop-snap/issues

grade: stable
confinement: strict
base: core22
architectures:
  - amd64

apps:
  claude-desktop:
    command: bin/claude-desktop-wrapper
    desktop: snap/gui/claude-desktop.desktop
    extensions: [gnome]
    environment:
      # Electron/Chrome flags for better compatibility
      DISABLE_WAYLAND: 1
      ELECTRON_DISABLE_SECURITY_WARNINGS: 1
      # Path for MCP configuration
      CLAUDE_CONFIG_PATH: $SNAP_USER_DATA/.config/Claude
    plugs:
      - audio-playback
      - browser-support
      - desktop
      - desktop-legacy
      - gsettings
      - home
      - network
      - network-bind
      - opengl
      - pulseaudio
      - removable-media
      - screen-inhibit-control
      - unity7
      - wayland
      - x11

parts:
  claude-desktop:
    plugin: nil
    build-packages:
      - wget
      - curl
      - p7zip-full
      - imagemagick
      - icoutils
      - python3-lxml
    stage-packages:
      - libgtk-3-0
      - libnotify4
      - libnss3
      - libxss1
      - libxtst6
      - libatspi2.0-0
      - libsecret-1-0
      - libasound2
      - libgbm1
      - libdrm2
    override-build: |
      set -eux
      
      # Download Claude download page and extract Windows installer URL
      echo "Fetching Claude download page..."
      wget -q -O download_page.html "https://claude.ai/download"
      
      # Extract Windows download URL using Python and lxml
      DOWNLOAD_URL=$(python3 << 'PYTHON_SCRIPT'
import sys
from lxml import html

with open('download_page.html', 'r') as f:
    content = f.read()

tree = html.fromstring(content)

# Multiple XPath strategies to find the Windows download link
xpaths = [
    "//a[contains(@href, 'windows') and contains(@href, '.exe')]/@href",
    "//a[contains(text(), 'Windows') or contains(text(), 'windows')]/@href",
    "//button[contains(text(), 'Windows')]/parent::a/@href",
    "//a[contains(@class, 'windows')]/@href",
    "//*[contains(text(), 'Windows')]/ancestor::a[1]/@href"
]

download_url = None
for xpath in xpaths:
    urls = tree.xpath(xpath)
    if urls:
        for url in urls:
            if '.exe' in url:
                download_url = url
                break
    if download_url:
        break

if download_url:
    # Make URL absolute if needed
    if not download_url.startswith('http'):
        download_url = 'https://claude.ai' + download_url
    print(download_url)
else:
    print("ERROR: Could not find Windows download URL", file=sys.stderr)
    sys.exit(1)
PYTHON_SCRIPT
      )
      
      if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "ERROR: Could not find Windows download URL" ]; then
        echo "Failed to extract download URL from page"
        exit 1
      fi
      
      echo "Found download URL: $DOWNLOAD_URL"
      
      # Download the Windows installer
      wget -O Claude-Setup.exe "$DOWNLOAD_URL"
      
      # Extract Windows installer
      7z x Claude-Setup.exe
      
      # Extract the main nupkg file containing app resources
      NUPKG=$(find . -name "*.nupkg" | head -1)
      if [ -n "$NUPKG" ]; then
        7z x "$NUPKG" -oapp_contents
      fi
      
      # Extract application resources
      mkdir -p $SNAPCRAFT_PART_INSTALL/claude-desktop
      cp -r app_contents/lib/net45/* $SNAPCRAFT_PART_INSTALL/claude-desktop/ || true
      
      # Handle Electron app.asar if present
      if [ -f "$SNAPCRAFT_PART_INSTALL/claude-desktop/resources/app.asar" ]; then
        # Keep app.asar and app.asar.unpacked as is
        echo "Found app.asar, keeping Electron structure intact"
      fi
      
      # Create directories for icon and desktop file
      mkdir -p $SNAPCRAFT_PART_INSTALL/meta/gui
      mkdir -p $SNAPCRAFT_PART_INSTALL/snap/gui
      
      # Extract icon from Windows executable
      wrestool -x -t 14 Claude-Setup.exe > claude.ico || true
      if [ -f claude.ico ]; then
        icotool -x claude.ico
        # Use the highest resolution PNG
        PNG_FILE=$(ls -1 claude_*_256x256x32.png 2>/dev/null | head -1 || ls -1 claude_*.png | sort -V | tail -1)
        if [ -n "$PNG_FILE" ]; then
          cp "$PNG_FILE" $SNAPCRAFT_PART_INSTALL/meta/gui/icon.png
          cp "$PNG_FILE" $SNAPCRAFT_PART_INSTALL/snap/gui/claude-desktop.png
        fi
      fi
      
      # If no icon extracted, create a placeholder
      if [ ! -f "$SNAPCRAFT_PART_INSTALL/meta/gui/icon.png" ]; then
        convert -size 256x256 xc:white -fill black -gravity center -pointsize 72 -annotate +0+0 'C' \
          $SNAPCRAFT_PART_INSTALL/meta/gui/icon.png
        cp $SNAPCRAFT_PART_INSTALL/meta/gui/icon.png $SNAPCRAFT_PART_INSTALL/snap/gui/claude-desktop.png
      fi
      
      # Create desktop file
      cat > $SNAPCRAFT_PART_INSTALL/snap/gui/claude-desktop.desktop << 'EOF'
      [Desktop Entry]
      Type=Application
      Version=1.0
      Name=Claude
      GenericName=AI Assistant
      Comment=Anthropic's Claude AI desktop application
      Exec=claude-desktop %U
      Icon=${SNAP}/meta/gui/icon.png
      Terminal=false
      StartupNotify=true
      Categories=Office;Utility;
      Keywords=ai;assistant;claude;anthropic;chat;mcp;
      MimeType=x-scheme-handler/claude;
      Actions=NewChat;
      
      [Desktop Action NewChat]
      Name=New Chat
      Exec=claude-desktop --new-chat
      Icon=document-new
      EOF
      
  claude-native-bindings:
    plugin: nil
    override-build: |
      # Create Linux-compatible stub for claude-native-bindings
      mkdir -p $SNAPCRAFT_PART_INSTALL/claude-desktop/resources
      cat > $SNAPCRAFT_PART_INSTALL/claude-desktop/resources/claude-native-bindings.js << 'EOF'
      // Linux stub implementation for claude-native-bindings
      module.exports = {
        registerGlobalShortcut: (shortcut, callback) => {
          console.log(`Global shortcut ${shortcut} registered (stub)`);
          return true;
        },
        unregisterGlobalShortcut: (shortcut) => {
          console.log(`Global shortcut ${shortcut} unregistered (stub)`);
          return true;
        },
        setTrayIcon: (iconPath) => {
          console.log(`Tray icon set to ${iconPath} (stub)`);
          return true;
        },
        showTrayBalloon: (title, content) => {
          console.log(`Tray balloon: ${title} - ${content} (stub)`);
          return true;
        }
      };
      EOF
  
  electron-wrapper:
    plugin: nil
    override-build: |
      # Create wrapper script to handle Electron execution
      mkdir -p $SNAPCRAFT_PART_INSTALL/bin
      cat > $SNAPCRAFT_PART_INSTALL/bin/claude-desktop-wrapper << 'EOF'
      #!/bin/bash
      set -e
      
      # Ensure config directory exists
      mkdir -p $SNAP_USER_DATA/.config/Claude
      
      # Copy default MCP config if it doesn't exist
      if [ ! -f "$SNAP_USER_DATA/.config/Claude/claude_desktop_config.json" ]; then
        cat > "$SNAP_USER_DATA/.config/Claude/claude_desktop_config.json" << 'EOCONF'
      {
        "mcpServers": {}
      }
      EOCONF
      fi
      
      # Set up Electron environment
      export ELECTRON_IS_SNAP=1
      export ELECTRON_SNAP=$SNAP
      
      # Launch Claude Desktop with --no-sandbox flag
      exec "$SNAP/claude-desktop/claude" --no-sandbox "$@"
      EOF
      chmod +x $SNAPCRAFT_PART_INSTALL/bin/claude-desktop-wrapper

layout:
  /usr/share/fonts:
    bind: $SNAP/usr/share/fonts
  /usr/share/icons:
    bind: $SNAP/usr/share/icons
  /usr/lib/$SNAPCRAFT_ARCH_TRIPLET/webkit2gtk-4.0:
    bind: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/webkit2gtk-4.0