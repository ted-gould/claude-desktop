name: claude-desktop
title: Claude Desktop
version: '1.0.0'
summary: Anthropic's Claude AI assistant desktop application
description: |
  Claude Desktop provides native access to Anthropic's Claude AI models
  with enhanced capabilities through Model Context Protocol (MCP) support.
  
  **Features:**
  - Direct access to Claude models (Claude 3.5 Sonnet, etc.)
  - Model Context Protocol (MCP) for extending capabilities
  - Native desktop integration with system tray support
  - Keyboard shortcuts including global hotkeys
  - Artifact mode for building custom applications
  
  **Note:** This is an unofficial Linux port of the official Claude Desktop
  application. Some features may have limited functionality compared to
  the official Windows/macOS versions.

license: Proprietary
contact: https://claude.ai/support
website: https://claude.ai
issues: https://github.com/[community-maintainer]/claude-desktop-snap/issues

grade: stable
confinement: devmode
base: core22
architectures:
  - amd64

apps:
  claude-desktop:
    command: bin/claude-desktop-wrapper
    desktop: snap/gui/claude-desktop.desktop
    extensions: [gnome]
    environment:
      # Electron/Chrome flags for better compatibility
      DISABLE_WAYLAND: 1
      ELECTRON_DISABLE_SECURITY_WARNINGS: 1
      # Path for MCP configuration
      CLAUDE_CONFIG_PATH: $SNAP_USER_DATA/.config/Claude
      # Disable sandboxing that might interfere
      ELECTRON_NO_SANDBOX: 1
    plugs:
      - audio-playback
      - browser-support
      - desktop
      - desktop-legacy
      - gsettings
      - home
      - network
      - network-bind
      - opengl
      - pulseaudio
      - removable-media
      - screen-inhibit-control
      - unity7
      - wayland
      - x11

layout:
  /usr/share/fonts:
    bind: $SNAP/usr/share/fonts
  /usr/share/icons:
    bind: $SNAP/usr/share/icons
  /usr/lib/$SNAPCRAFT_ARCH_TRIPLET/webkit2gtk-4.0:
    bind: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/webkit2gtk-4.0

parts:
  claude-desktop:
    plugin: dump
    source: https://storage.googleapis.com/osprey-downloads-c02f6a0d-347c-492b-a752-3e0651722e97/nest-win-x64/Claude-Setup-x64.exe
    source-type: file
    build-packages:
      - wget
      - p7zip-full
      - imagemagick
      - unzip
      - npm
      - nodejs
      - build-essential
      - gcc
      - g++
    stage-packages:
      - libgtk-3-0
      - libnotify4
      - libnss3
      - libxss1
      - libxtst6
      - libatspi2.0-0
      - libsecret-1-0
      - libasound2
      - libgbm1
      - libdrm2
    override-build: |
      set -eux
      
      # Extract Windows installer
      7z x Claude-Setup-x64.exe
      
      # The installer might contain another archive
      NUPKG=$(find . -name "*.nupkg" | grep -v "delta" | head -1)
      
      if [ -n "$NUPKG" ]; then
        echo "Found nupkg: $NUPKG"
        7z x "$NUPKG" -oapp_contents
        
        # The actual app files are usually in lib/net45 or similar
        APP_DIR=$(find app_contents -name "Claude.exe" -o -name "resources" | head -1 | xargs dirname)
        if [ -n "$APP_DIR" ]; then
          mkdir -p $SNAPCRAFT_PART_INSTALL/claude-desktop
          cp -r "$APP_DIR"/* $SNAPCRAFT_PART_INSTALL/claude-desktop/
        fi
      fi
      
      # Download Linux Electron binary
      ELECTRON_VERSION="28.0.0"
      echo "Using Electron version: $ELECTRON_VERSION"
      
      wget -O electron.zip "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-linux-x64.zip"
      unzip -o electron.zip -d $SNAPCRAFT_PART_INSTALL/claude-desktop/
      rm electron.zip
      
      # Rename electron executable
      mv $SNAPCRAFT_PART_INSTALL/claude-desktop/electron $SNAPCRAFT_PART_INSTALL/claude-desktop/claude
      chmod +x $SNAPCRAFT_PART_INSTALL/claude-desktop/claude
      
      # Fix permissions
      find $SNAPCRAFT_PART_INSTALL -type f -exec chmod 644 {} \;
      find $SNAPCRAFT_PART_INSTALL -type d -exec chmod 755 {} \;
      find $SNAPCRAFT_PART_INSTALL -name "*.node" -type f -exec chmod 755 {} \;
      find $SNAPCRAFT_PART_INSTALL -name "*.so" -type f -exec chmod 755 {} \;
      find $SNAPCRAFT_PART_INSTALL -name "claude" -type f -exec chmod 755 {} \;
      
      # Create a fake native module that won't crash
      mkdir -p $SNAPCRAFT_PART_INSTALL/claude-desktop/resources/app.asar.unpacked/node_modules/claude-native
      
      # Instead of building a real native module, create a minimal valid ELF shared library
      cd $SNAPCRAFT_PART_INSTALL/claude-desktop/resources/app.asar.unpacked/node_modules/claude-native
      
      # Create a minimal C file that compiles to a valid shared library
      cat > fake_node_module.c << 'EOF'
      // Minimal valid shared library that can be loaded by dlopen
      void _init() {}
      void _fini() {}
      EOF
      
      # Compile it to a shared library
      gcc -shared -fPIC -o claude-native-binding.node fake_node_module.c || {
        echo "Failed to compile fake module, creating empty file"
        touch claude-native-binding.node
      }
      
      cd -
      
      # Now we need to intercept the require() call
      # Let's modify the Electron launch to preload a script
      mkdir -p $SNAPCRAFT_PART_INSTALL/claude-desktop/resources
      cat > $SNAPCRAFT_PART_INSTALL/claude-desktop/resources/preload-stub.js << 'EOF'
      // Preload script to stub out native modules
      const Module = require('module');
      const path = require('path');
      
      // Store original _load
      const originalLoad = Module._load;
      
      // Override Module._load
      Module._load = function(request, parent, isMain) {
        // Check if this is the claude-native module
        if (request.includes('claude-native-binding.node') || 
            (parent && parent.filename && parent.filename.includes('claude-native/index.js') && request.startsWith('./'))) {
          console.log('Intercepting native module request:', request);
          // Return our stub implementation
          return {
            registerGlobalShortcut: (shortcut, callback) => {
              console.log(`Stub: registerGlobalShortcut ${shortcut}`);
              return true;
            },
            unregisterGlobalShortcut: (shortcut) => {
              console.log(`Stub: unregisterGlobalShortcut ${shortcut}`);
              return true;
            },
            unregisterAllGlobalShortcuts: () => {
              console.log('Stub: unregisterAllGlobalShortcuts');
              return true;
            },
            setTrayIcon: (iconPath) => {
              console.log('Stub: setTrayIcon');
              return true;
            },
            showTrayBalloon: (title, content) => {
              console.log(`Stub: showTrayBalloon ${title}`);
              return true;
            },
            getWindowHandle: () => null,
            isAccessibilityEnabled: () => true,
            setLoginItemSettings: (settings) => {
              console.log('Stub: setLoginItemSettings');
            },
            getLoginItemSettings: () => ({ openAtLogin: false })
          };
        }
        
        // Call original for everything else
        return originalLoad.apply(this, arguments);
      };
      
      console.log('Native module stub preload installed');
      EOF
      
      # Create icon
      mkdir -p $SNAPCRAFT_PART_INSTALL/meta/gui
      mkdir -p $SNAPCRAFT_PART_INSTALL/snap/gui
      
      convert -size 256x256 xc:white -fill black -gravity center -pointsize 72 -annotate +0+0 'C' \
        $SNAPCRAFT_PART_INSTALL/meta/gui/icon.png
      cp $SNAPCRAFT_PART_INSTALL/meta/gui/icon.png $SNAPCRAFT_PART_INSTALL/snap/gui/claude-desktop.png
      
      # Create desktop file
      cat > $SNAPCRAFT_PART_INSTALL/snap/gui/claude-desktop.desktop << 'EOF'
      [Desktop Entry]
      Type=Application
      Version=1.0
      Name=Claude
      GenericName=AI Assistant
      Comment=Anthropic's Claude AI desktop application
      Exec=claude-desktop %U
      Icon=${SNAP}/meta/gui/icon.png
      Terminal=false
      StartupNotify=true
      Categories=Office;Utility;
      Keywords=ai;assistant;claude;anthropic;chat;mcp;
      MimeType=x-scheme-handler/claude;
      Actions=NewChat;
      
      [Desktop Action NewChat]
      Name=New Chat
      Exec=claude-desktop --new-chat
      EOF
  
  electron-wrapper:
    plugin: nil
    override-prime: |
      snapcraftctl prime
      # Ensure all files have proper permissions in the final snap
      chmod -R u+r,g+r,o+r $SNAPCRAFT_PRIME
      find $SNAPCRAFT_PRIME -type d -exec chmod 755 {} \;
      find $SNAPCRAFT_PRIME -name "*.asar" -exec chmod 644 {} \;
    override-build: |
      # Create wrapper script to handle Electron execution
      mkdir -p $SNAPCRAFT_PART_INSTALL/bin
      cat > $SNAPCRAFT_PART_INSTALL/bin/claude-desktop-wrapper << 'EOF'
      #!/bin/bash
      set -e
      
      # Ensure config directory exists
      mkdir -p $SNAP_USER_DATA/.config/Claude
      
      # Copy default MCP config if it doesn't exist
      if [ ! -f "$SNAP_USER_DATA/.config/Claude/claude_desktop_config.json" ]; then
        cat > "$SNAP_USER_DATA/.config/Claude/claude_desktop_config.json" << 'EOCONF'
      {
        "mcpServers": {}
      }
      EOCONF
      fi
      
      # Set up Electron environment
      export ELECTRON_IS_SNAP=1
      export ELECTRON_SNAP=$SNAP
      
      # Launch Claude Desktop
      # Try to use preload script to intercept native module loading
      if [ -f "$SNAP/claude-desktop/resources/preload-stub.js" ]; then
        exec "$SNAP/claude-desktop/claude" --no-sandbox --preload="$SNAP/claude-desktop/resources/preload-stub.js" "$@"
      else
        exec "$SNAP/claude-desktop/claude" --no-sandbox "$@"
      fi
      EOF
      chmod +x $SNAPCRAFT_PART_INSTALL/bin/claude-desktop-wrapper